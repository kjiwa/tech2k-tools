name: Bug report
description: Something in tech2k-tools doesn't work as documented.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead. Do not include credentials.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: The release version, as named on the GitHub release page or the downloaded file.
    validations:
      required: true
  - type: dropdown
    id: interface
    attributes:
      label: Interface
      options:
        - GUI
        - CLI
        - marcone library
    validations:
      required: true
  - type: dropdown
    id: platform
    attributes:
      label: Platform
      options:
        - macOS
        - Windows
        - Linux
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Minimal reproduction
      description: Steps and, if you can share it, a minimal spreadsheet that triggers the bug.
    validations:
      required: false
