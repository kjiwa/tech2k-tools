name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Install system dependencies for Qt/PySide6
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Run linter
        run: uv run ruff check .

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest

  build-smoke-test:
    name: Build Smoke Test (${{ matrix.os }})
    needs: test
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages

      - name: Generate icon assets
        run: uv run python packaging/generate_icons.py

      - name: Package with PyInstaller
        run: uv run pyinstaller --clean --noconfirm packaging/inventory_updater.spec

      - name: Verify macOS app bundle
        if: runner.os == 'macOS'
        run: |
          test -d "dist/Tech2000-InventoryUpdater.app"
          codesign -dv --verbose=4 "dist/Tech2000-InventoryUpdater.app"

      - name: Verify Windows executable
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Test-Path "dist/Tech2000-InventoryUpdater/Tech2000-InventoryUpdater.exe")) {
            throw "Executable was not produced"
          }

