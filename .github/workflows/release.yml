name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    name: Verify release tag
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Install system dependencies for Qt/PySide6
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon-x11-0 libdbus-1-3

      - name: Run linter
        run: uv run ruff check .

      - name: Check formatting
        run: uv run ruff format --check .

      - name: Run tests
        env:
          QT_QPA_PLATFORM: offscreen
        run: uv run pytest

      - name: Check tag matches project versions and changelog
        run: sh scripts/check-release.sh "$GITHUB_REF_NAME"

  build-macos:
    name: Build macOS (Apple Silicon)
    needs: verify
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Generate icon assets
        run: uv run python packaging/generate_icons.py

      - name: Package with PyInstaller
        run: uv run pyinstaller --clean --noconfirm packaging/inventory_updater.spec

      - name: Sign macOS app bundle (ad-hoc)
        run: codesign --force --deep -s - dist/Tech2000-InventoryUpdater.app

      - name: Package DMG installer
        run: |
          mkdir -p dmg_root
          cp -R dist/Tech2000-InventoryUpdater.app dmg_root/
          ln -s /Applications dmg_root/Applications
          hdiutil create -volname "Tech 2000 Inventory Price Updater" -srcfolder dmg_root -ov -format UDZO dist/Tech2000-InventoryUpdater-macOS-arm64.dmg
          rm -rf dmg_root

      - name: Package portable ZIP
        run: |
          cd dist
          zip -r -y Tech2000-InventoryUpdater-macOS-arm64.zip Tech2000-InventoryUpdater.app
          cd ..

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-artifacts
          path: |
            dist/Tech2000-InventoryUpdater-macOS-arm64.dmg
            dist/Tech2000-InventoryUpdater-macOS-arm64.zip
          retention-days: 1

  build-windows:
    name: Build Windows (x64)
    needs: verify
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: "0.12.23"
          enable-cache: true

      - name: Set up Python 3.12
        run: uv python install 3.12

      - name: Install dependencies
        run: uv sync --all-packages --locked

      - name: Generate icon assets
        run: uv run python packaging/generate_icons.py

      - name: Package with PyInstaller
        run: uv run pyinstaller --clean --noconfirm packaging/inventory_updater.spec

      - name: Build Inno Setup installer
        shell: pwsh
        run: |
          $version = "${env:GITHUB_REF_NAME}".TrimStart("v")
          if (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc "/DAppVersion=$version" packaging/installer.iss
          } elseif (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/installer.iss
          } else {
            choco install innosetup -y --no-progress
            & "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" "/DAppVersion=$version" packaging/installer.iss
          }

      - name: Package portable ZIP
        shell: pwsh
        run: |
          Compress-Archive -Path dist\Tech2000-InventoryUpdater\* -DestinationPath dist\Tech2000-InventoryUpdater-Windows-x64-Portable.zip -Force

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: windows-artifacts
          path: |
            dist/Tech2000-InventoryUpdater-Windows-x64-Setup.exe
            dist/Tech2000-InventoryUpdater-Windows-x64-Portable.zip
          retention-days: 1

  publish-release:
    name: Publish Release
    needs: [build-macos, build-windows]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Create release directory
        run: mkdir -p release-assets

      - name: Download macOS artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-artifacts
          path: release-assets

      - name: Download Windows artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: windows-artifacts
          path: release-assets

      - name: Extract release notes
        run: sh scripts/check-release.sh --notes "${GITHUB_REF_NAME#v}" > release-notes.md

      - name: Generate checksums
        run: |
          cd release-assets
          sha256sum * > SHA256SUMS.txt
          cat SHA256SUMS.txt
          cd ..

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          files: |
            release-assets/*
          body_path: release-notes.md
          draft: false
          prerelease: false
