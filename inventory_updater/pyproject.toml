[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inventory-updater"
version = "1.0.0"
description = "Tool to update InventoryItems.xlsx with live pricing from Marcone"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "tech2k" }]
dependencies = [
    "marcone",
    "openpyxl>=3.1.2",
    "pyside6>=6.6.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
inventory-updater = "inventory_updater.cli:main"
inventory-updater-gui = "inventory_updater.gui:main"

[tool.hatch.build.targets.wheel]
packages = ["src/inventory_updater"]

