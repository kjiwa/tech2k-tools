[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "marcone"
version = "1.0.0"
description = "Python client library for the Marcone appliance parts portal"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "tech2k" }]
dependencies = [
    "requests>=2.31.0",
    "beautifulsoup4>=4.12.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/marcone"]
