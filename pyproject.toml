[project]
name = "tech2k-tools"
version = "1.1.0"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "marcone",
    "inventory-updater",
]

[tool.uv.workspace]
members = ["marcone", "inventory_updater"]

[tool.uv.sources]
marcone = { workspace = true }
inventory-updater = { workspace = true }

[dependency-groups]
dev = [
    "pyinstaller>=6.22.3",
    "pytest>=9.1.1",
    "requests-mock>=1.12.1",
    "ruff>=0.16.10",
]


[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["marcone/tests", "inventory_updater/tests", "tests"]
pythonpath = ["."]
